<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anwar Iron and Hardware Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .bill-container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .logo-svg { width: 50px; height: 50px; }
        .store-details h2 { margin: 0; font-size: 18px; color: #111; }
        .store-details p { margin: 0; font-size: 12px; color: #666; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: right; border-bottom: 2px solid #ddd; padding: 5px; font-size: 14px; }
        td { text-align: right; padding: 8px 5px; border-bottom: 1px solid #eee; font-size: 14px; }
        
        .input-group { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-add { background-color: #2c3e50; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-pdf { background-color: #007bff; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="bill-container">
    <div class="header">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <polyline points="20,60 50,30 80,60" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="68" cy="40" r="12" fill="none" stroke="#d97706" stroke-width="4"/>
            <circle cx="68" cy="40" r="4" fill="#d97706"/>
        </svg>
        <div class="store-details">
            <h2>Anwar Iron & Hardware</h2>
            <p>Main Ajnala Road, Bhalwal</p>
        </div>
    </div>

    <div><strong>کسٹمر:</strong> <span id="dispCust">---</span></div>
    
    <table>
        <thead><tr><th>آئٹم</th><th>مقدار</th><th>قیمت</th></tr></thead>
        <tbody id="billBody"></tbody>
    </table>

    <div style="margin-top: 10px; text-align: left; font-weight: bold;">
        کل رقم: <span id="grandTotal">0</span>
    </div>

    <!-- ان پٹ سیکشن -->
    <div class="input-group no-print">
        <input type="text" id="custName" placeholder="کسٹمر کا نام" oninput="document.getElementById('dispCust').innerText = this.value">
        <input type="text" id="itemName" placeholder="آئٹم کا نام">
        <div style="display: flex; gap: 5px;">
            <input type="number" id="itemQty" placeholder="مقدار" style="flex: 2;">
            <select id="itemUnit" style="flex: 1;">
                <option value="Pcs">Pcs</option>
                <option value="Feet">Feet</option>
                <option value="KG">KG</option>
                <option value="Bundle">Bundle</option>
            </select>
        </div>
        <input type="number" id="itemRate" placeholder="فی ریٹ">
        <button class="btn btn-add" onclick="addItem()">آئٹم شامل کریں</button>
        
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">واٹس ایپ پر شیئر کریں</button>
        <button class="btn btn-pdf" onclick="window.print()">پی ڈی ایف ڈاؤن لوڈ کریں</button>
    </div>
</div>

<script>
    let items = [];
    function addItem() {
        let name = document.getElementById('itemName').value;
        let qty = document.getElementById('itemQty').value;
        let unit = document.getElementById('itemUnit').value;
        let rate = document.getElementById('itemRate').value;
        if(!name || !qty || !rate) return alert("سب خانے پُر کریں");
        let total = qty * rate;
        items.push({name, qty, unit, total});
        render();
    }
    function render() {
        let body = document.getElementById('billBody');
        body.innerHTML = '';
        let grandTotal = 0;
        items.forEach(i => {
            grandTotal += i.total;
            body.innerHTML += `<tr><td>${i.name}</td><td>${i.qty} ${i.unit}</td><td>${i.total}</td></tr>`;
        });
        document.getElementById('grandTotal').innerText = grandTotal;
    }
    function shareWhatsApp() {
        let msg = "بل از: Anwar Iron Store\n";
        items.forEach(i => msg += `${i.name}: ${i.qty} ${i.unit} - ${i.total} Rs\n`);
        msg += "کل رقم: " + document.getElementById('grandTotal').innerText;
        window.open("https://wa.me/?text=" + encodeURIComponent(msg));
    }
</script>
</body>
</html>
