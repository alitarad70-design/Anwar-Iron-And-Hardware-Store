<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anwar Iron Store</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-3 sm:p-6 font-sans min-h-screen">

  <div class="max-w-md mx-auto space-y-4">
    <h2 class="text-2xl font-bold text-amber-500 text-center tracking-wide">ANWAR IRON STORE</h2>

    <!-- Customer Details -->
    <div class="space-y-2 bg-slate-800 p-3 rounded-lg border border-slate-700">
      <input type="text" id="cust-name" placeholder="Customer Name" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-amber-500">
      <input type="tel" id="cust-phone" placeholder="WhatsApp number (03xx...)" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-amber-500">
    </div>

    <!-- Item Inputs -->
    <div class="space-y-2 bg-slate-800 p-3 rounded-lg border border-slate-700">
      <input type="text" id="item-name" placeholder="Item Name" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white">
      <div class="grid grid-cols-3 gap-2">
        <input type="number" id="item-qty" placeholder="Qty" class="p-2 bg-slate-900 border border-slate-700 rounded text-white">
        <input type="text" id="item-unit" placeholder="Unit (ft/kg)" class="p-2 bg-slate-900 border border-slate-700 rounded text-white">
        <input type="number" id="item-rate" placeholder="Rate" class="p-2 bg-slate-900 border border-slate-700 rounded text-white">
      </div>
      <button onclick="addItem()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-2.5 rounded">Add Item</button>
    </div>

    <!-- Printable Bill Receipt (Pure White Background) -->
    <div id="printable-bill" class="bg-white text-slate-900 p-5 rounded-lg shadow-xl border border-slate-200">
      <h3 class="font-bold text-center border-b pb-2 mb-3 text-lg text-slate-900">BILL RECEIPT</h3>
      
      <div class="text-xs mb-3 flex justify-between text-slate-600">
        <span>Customer: <b id="disp-cust-name" class="text-slate-900">-</b></span>
        <span>Phone: <b id="disp-cust-phone" class="text-slate-900">-</b></span>
      </div>

      <table class="w-full text-xs sm:text-sm border-collapse mb-3">
        <thead>
          <tr class="border-b border-slate-300 text-slate-700">
            <th class="text-left py-1">Item</th>
            <th class="text-center">Qty</th>
            <th class="text-center">Rate</th>
            <th class="text-right">Total</th>
          </tr>
        </thead>
        <tbody id="bill-items-body"></tbody>
      </table>

      <!-- Totals & Discount -->
      <div class="mt-3 pt-2 border-t border-slate-300 space-y-1 font-bold text-sm text-slate-900">
        <div class="flex justify-between">
          <span>Subtotal:</span>
          <span id="sub-total">Rs 0</span>
        </div>
        <div class="flex justify-between items-center my-1">
          <span>Discount:</span>
          <input type="number" id="discount-val" value="0" oninput="calculate()" class="w-20 border border-slate-400 rounded p-1 text-right bg-slate-50 text-slate-900 font-bold">
        </div>
        <div class="flex justify-between text-base text-red-600 border-t border-slate-300 pt-1">
          <span>Total Amount:</span>
          <span id="grand-total">Rs 0</span>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="downloadPDF()" class="bg-rose-600 hover:bg-rose-700 text-white p-3 rounded font-bold">PDF Download</button>
      <button onclick="saveBill()" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold">Save</button>
      <button onclick="sendWAText()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded font-bold">WhatsApp Text</button>
      <button onclick="sendWAImage()" class="bg-teal-600 hover:bg-teal-700 text-white p-3 rounded font-bold">WhatsApp Image</button>
    </div>
  </div>

  <script>
    let items = [];

    document.getElementById('cust-name').addEventListener('input', (e) => {
      document.getElementById('disp-cust-name').innerText = e.target.value || '-';
    });
    document.getElementById('cust-phone').addEventListener('input', (e) => {
      document.getElementById('disp-cust-phone').innerText = e.target.value || '-';
    });

    function addItem() {
      let name = document.getElementById('item-name').value;
      let qty = parseFloat(document.getElementById('item-qty').value) || 0;
      let unit = document.getElementById('item-unit').value || '';
      let rate = parseFloat(document.getElementById('item-rate').value) || 0;
      let total = qty * rate;

      if (name && qty > 0) {
        items.push({ name, qty, unit, rate, total });
        calculate();

        document.getElementById('item-name').value = '';
        document.getElementById('item-qty').value = '';
        document.getElementById('item-unit').value = '';
        document.getElementById('item-rate').value = '';
      }
    }

    function calculate() {
      let sub = items.reduce((sum, item) => sum + item.total, 0);
      let disc = parseFloat(document.getElementById('discount-val').value) || 0;
      let grand = sub - disc;

      document.getElementById('sub-total').innerText = 'Rs ' + sub;
      document.getElementById('grand-total').innerText = 'Rs ' + grand;

      let tbody = document.getElementById('bill-items-body');
      tbody.innerHTML = items.map(item => `
        <tr class="border-b border-slate-200">
          <td class="py-1.5 text-slate-800">${item.name}</td>
          <td class="text-center text-slate-800">${item.qty} ${item.unit}</td>
          <td class="text-center text-slate-800">${item.rate}</td>
          <td class="text-right text-slate-800 font-medium">Rs ${item.total}</td>
        </tr>
      `).join('');
    }

    function downloadPDF() {
      const element = document.getElementById('printable-bill');
      html2pdf().set({
        margin: 5,
        filename: 'Anwar-Iron-Bill.pdf',
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' }
      }).from(element).save();
    }

    function sendWAText() {
      let phone = document.getElementById('cust-phone').value;
      let grand = document.getElementById('grand-total').innerText;
      let msg = `Anwar Iron Store - Total Bill Amount: ${grand}`;
      window.open(`https://wa.me/92${phone.replace(/^0/, '')}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function sendWAImage() {
      const element = document.getElementById('printable-bill');
      try {
        const canvas = await html2canvas(element, { scale: 2 });
        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'BillReceipt.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'Bill Receipt',
              text: 'Anwar Iron Store Bill'
            });
          } else {
            downloadPDF();
            alert('تصویر بھیجنے کے لیے فائل ڈاؤن لوڈ کر دی گئی ہے۔');
          }
        }, 'image/png');
      } catch (err) {
        alert('مسئلہ آیا ہے، دوبارہ کوشش کریں۔');
      }
    }

    function saveBill() {
      let bills = JSON.parse(localStorage.getItem('my_bills') || '[]');
      bills.push({
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        total: document.getElementById('grand-total').innerText,
        date: new Date().toLocaleDateString()
      });
      localStorage.setItem('my_bills', JSON.stringify(bills));
      alert('بل محفوظ کر لیا گیا ہے!');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
