<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anwar Iron & Hardware Store</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #003366; padding-bottom: 10px; margin-bottom: 15px; }
        .header h1 { color: #003366; font-size: 22px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .row { display: flex; gap: 8px; }
        .row div { flex: 1; }
        button { background: #003366; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 5px; }
        button:hover { background: #002244; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #f0f0f0; }
        .totals { margin-top: 15px; text-align: right; }
        .totals p { font-size: 14px; font-weight: bold; margin: 4px 0; }
        .grand-total { font-size: 18px; color: #d9534f; }
        .btn-print { background: #28a745; margin-top: 10px; }
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Anwar Iron & Hardware Store</h1>
        <p style="font-size: 12px; color: #666;">Custom Billing & Invoice System</p>
    </div>

    <!-- Add Custom Item Form -->
    <div class="no-print">
        <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="custName" placeholder="Enter customer name">
        </div>
        <hr style="margin: 15px 0;">
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Iron Pipe / Steel Bar">
        </div>
        <div class="row">
            <div>
                <label>Unit Type</label>
                <select id="unitType">
                    <option value="Pcs">Per Piece (Pcs)</option>
                    <option value="KG">Per KG (kg)</option>
                    <option value="Feet">Per Feet (ft)</option>
                </select>
            </div>
            <div>
                <label>Qty / Weight / Length</label>
                <input type="number" id="itemQty" step="0.01" placeholder="e.g. 2.5">
            </div>
            <div>
                <label>Rate (PKR)</label>
                <input type="number" id="itemRate" step="0.01" placeholder="e.g. 500">
            </div>
        </div>
        <button onclick="addItem()">+ Add to Bill</button>
    </div>

    <!-- Invoice Table -->
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Unit</th>
                <th>Qty</th>
                <th>Rate</th>
                <th>Total (PKR)</th>
                <th class="no-print">Action</th>
            </tr>
        </thead>
        <tbody id="billBody">
            <!-- Dynamic Items -->
        </tbody>
    </table>

    <!-- Totals Section -->
    <div class="totals">
        <p>Subtotal: PKR <span id="subTotal">0</span></p>
        <div class="no-print" style="display: inline-block; width: 150px; margin: 5px 0;">
            <label style="font-size: 12px;">Discount (PKR):</label>
            <input type="number" id="discount" value="0" oninput="calculateTotals()">
        </div>
        <p class="grand-total">Grand Total: PKR <span id="grandTotal">0</span></p>
    </div>

    <button class="btn-print no-print" onclick="window.print()">Print / Save as PDF</button>
</div>

<script>
    let billItems = [];

    function addItem() {
        const name = document.getElementById('itemName').value;
        const unit = document.getElementById('unitType').value;
        const qty = parseFloat(document.getElementById('itemQty').value) || 0;
        const rate = parseFloat(document.getElementById('itemRate').value) || 0;

        if (!name || qty <= 0 || rate <= 0) {
            alert('Please enter valid Item Name, Quantity, and Rate.');
            return;
        }

        const total = qty * rate;
        billItems.push({ name, unit, qty, rate, total });

        // Reset inputs
        document.getElementById('itemName').value = '';
        document.getElementById('itemQty').value = '';
        document.getElementById('itemRate').value = '';

        renderBill();
    }

    function removeItem(index) {
        billItems.splice(index, 1);
        renderBill();
    }

    function renderBill() {
        const tbody = document.getElementById('billBody');
        tbody.innerHTML = '';
        let subtotal = 0;

        billItems.forEach((item, index) => {
            subtotal += item.total;
            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.unit}</td>
                    <td>${item.qty}</td>
                    <td>${item.rate}</td>
                    <td>${item.total.toFixed(2)}</td>
                    <td class="no-print"><button onclick="removeItem(${index})" style="background:red; padding:3px 7px;">X</button></td>
                </tr>
            `;
        });

        document.getElementById('subTotal').innerText = subtotal.toFixed(2);
        calculateTotals();
    }

    function calculateTotals() {
        const subtotal = parseFloat(document.getElementById('subTotal').innerText) || 0;
        const discount = parseFloat(document.getElementById('discount').value) || 0;
        const grandTotal = Math.max(0, subtotal - discount);
        document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    }
</script>

</body>
</html>
