<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anwar Iron Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #1e293b; color: white; font-family: sans-serif; }
        .bill-card { background-color: white; color: black; }
    </style>
</head>
<body class="p-4">

<div class="max-w-md mx-auto bill-card p-6 rounded-lg shadow-lg" id="bill">
    <h2 class="text-2xl font-bold text-center text-orange-600 mb-4">ANWAR IRON STORE</h2>
    
    <!-- Inputs -->
    <div class="space-y-2 mb-6">
        <input type="text" id="cust-name" placeholder="Customer Name" class="w-full p-2 border rounded">
        <input type="text" id="cust-phone" placeholder="WhatsApp Number" class="w-full p-2 border rounded">
        <hr>
        <input type="text" id="item-name" placeholder="Item Name" class="w-full p-2 border rounded">
        <div class="grid grid-cols-3 gap-2">
            <input type="number" id="item-qty" placeholder="Qty" class="p-2 border rounded">
            <input type="text" id="item-unit" placeholder="Unit" class="p-2 border rounded">
            <input type="number" id="item-rate" placeholder="Rate" class="p-2 border rounded">
        </div>
        <button onclick="addItem()" class="w-full bg-orange-600 text-white p-2 rounded font-bold">Add Item</button>
    </div>

    <!-- Bill Table -->
    <table class="w-full text-sm border-collapse mb-4">
        <thead>
            <tr class="border-b">
                <th class="text-left py-2">Item</th>
                <th>Qty</th>
                <th>Rate</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="bill-body"></tbody>
    </table>

    <!-- Totals -->
    <div class="border-t pt-2 space-y-1">
        <div class="flex justify-between font-bold"><span>Subtotal:</span> <span id="sub-total">0</span></div>
        <div class="flex justify-between items-center">
            <span>Discount:</span>
            <input type="number" id="discount-val" value="0" oninput="calculate()" class="w-20 border rounded p-1 text-right">
        </div>
        <div class="flex justify-between font-bold text-lg text-red-600 border-t mt-2 pt-1">
            <span>Total Amount:</span> <span id="grand-total">0</span>
        </div>
    </div>
</div>

<!-- Buttons -->
<div class="max-w-md mx-auto grid grid-cols-2 gap-2 mt-4">
    <button onclick="downloadPDF()" class="bg-rose-600 text-white p-3 rounded font-bold">PDF Download</button>
    <button onclick="window.print()" class="bg-blue-600 text-white p-3 rounded font-bold">Print Bill</button>
</div>

<script>
    let items = [];

    function addItem() {
        let name = document.getElementById('item-name').value;
        let qty = parseFloat(document.getElementById('item-qty').value) || 0;
        let unit = document.getElementById('item-unit').value;
        let rate = parseFloat(document.getElementById('item-rate').value) || 0;
        let total = qty * rate;

        if (name && qty > 0) {
            items.push({name, qty, unit, rate, total});
            calculate();
            // Clear inputs
            document.getElementById('item-name').value = '';
            document.getElementById('item-qty').value = '';
            document.getElementById('item-unit').value = '';
            document.getElementById('item-rate').value = '';
        }
    }

    function calculate() {
        let sub = items.reduce((sum, i) => sum + i.total, 0);
        let disc = parseFloat(document.getElementById('discount-val').value) || 0;
        let grand = sub - disc;

        document.getElementById('sub-total').innerText = sub;
        document.getElementById('grand-total').innerText = grand;

        let tbody = document.getElementById('bill-body');
        tbody.innerHTML = items.map(i => `
            <tr class="border-b">
                <td class="py-2">${i.name}</td>
                <td class="text-center">${i.qty} ${i.unit}</td>
                <td class="text-center">${i.rate}</td>
                <td class="text-right">${i.total}</td>
            </tr>
        `).join('');
    }

    function downloadPDF() {
        const element = document.getElementById('bill');
        html2pdf().from(element).save('Anwar-Iron-Bill.pdf');
    }
</script>

</body>
</html>
