<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anwar Iron Store</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background-color: white; color: black; font-family: sans-serif; }
    .bill-box { background: white; color: black; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body class="p-4">

<div class="max-w-md mx-auto space-y-4">
  <h2 class="text-xl font-bold text-amber-500 text-center">ANWAR IRON STORE</h2>

  <!-- Inputs -->
  <input type="text" id="cust-name" placeholder="کسٹمر نام" class="w-full p-2 bg-slate-800 rounded">
  <input type="tel" id="cust-phone" placeholder="واٹس ایپ نمبر (03xx...)" class="w-full p-2 bg-slate-800 rounded">
  
  <div class="grid grid-cols-2 gap-2">
    <input type="text" id="item-name" placeholder="آئٹم" class="p-2 bg-slate-800 rounded">
    <input type="number" id="item-rate" placeholder="ریٹ" class="p-2 bg-slate-800 rounded">
  </div>
  <button onclick="addItem()" class="w-full bg-amber-600 p-2 rounded font-bold">آئٹم شامل کریں</button>

  <!-- Bill View -->
  <div id="printable-bill" class="bill-box">
    <h3 class="font-bold border-b mb-2">بل کی تفصیل</h3>
    <table class="w-full text-sm" id="bill-table">
      <thead><tr class="border-b"><th>آئٹم</th><th>ریٹ</th></tr></thead>
      <tbody id="bill-items"></tbody>
    </table>
    
    <div class="mt-4 pt-2 border-t font-bold">
      <div class="flex justify-between"><span>سب ٹوٹل:</span> <span id="sub-total">0</span></div>
      <div class="flex justify-between">
        <span>ڈسکاؤنٹ:</span> 
        <input type="number" id="discount-val" value="0" oninput="calculate()" class="w-20 text-right border">
      </div>
      <div class="flex justify-between text-lg mt-2 text-red-600"><span>کل رقم:</span> <span id="grand-total">0</span></div>
      <!-- Subtotal -->
<div class="flex justify-between items-center py-1 text-slate-300">
  <span>Subtotal (اصل رقم):</span>
  <span id="subtotal-amount">Rs 0</span>
</div>

<!-- Discount Input -->
<div class="flex justify-between items-center py-1 text-slate-300">
  <span>Discount (ڈسکاؤنٹ):</span>
  <input type="number" id="discount-amount" value="0" oninput="renderCurrentBill()" class="w-24 bg-slate-900 border border-slate-700 rounded p-1 text-right text-amber-400 font-bold focus:outline-none">
</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="grid grid-cols-2 gap-2">
    <button onclick="downloadPDF()" class="bg-rose-600 p-3 rounded">PDF ڈاؤن لوڈ</button>
    <button onclick="saveBill()" class="bg-blue-600 p-3 rounded">سیو کریں</button>
    <button onclick="sendWA()" class="bg-emerald-600 p-3 rounded col-span-2">WhatsApp پر بھیجیں</button>
  </div>
</div>

<script>
  let items = [];
  
  function addItem() {
    let name = document.getElementById('item-name').value;
    let rate = parseFloat(document.getElementById('item-rate').value) || 0;
    items.push({name, rate});
    calculate();
  }

  function calculate() {
    let sub = items.reduce((a, b) => a + b.rate, 0);
    let disc = parseFloat(document.getElementById('discount-val').value) || 0;
    document.getElementById('sub-total').innerText = sub;
    document.getElementById('grand-total').innerText = sub - disc;
    
    let html = items.map(i => `<tr><td>${i.name}</td><td>${i.rate}</td></tr>`).join('');
    document.getElementById('bill-items').innerHTML = html;
  }

  function downloadPDF() {
    html2pdf().from(document.getElementById('printable-bill')).save('Bill.pdf');
  }

  function saveBill() {
    let bills = JSON.parse(localStorage.getItem('my_bills') || '[]');
    bills.push({name: document.getElementById('cust-name').value, total: document.getElementById('grand-total').innerText});
    localStorage.setItem('my_bills', JSON.stringify(bills));
    alert('بل سیو ہو گیا!');
  }

  function sendWA() {
    let phone = document.getElementById('cust-phone').value;
    let msg = `بل کی تفصیل: کل رقم ${document.getElementById('grand-total').innerText}`;
    window.open(`https://wa.me/92${phone.substring(1)}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // Service Worker
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
